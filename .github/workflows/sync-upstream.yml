name: Sync upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream
        run: git remote add upstream https://github.com/blender/blender.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream (ours strategy)
        run: |
          git merge upstream/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
          git diff --name-only --diff-filter=U | while IFS= read -r f; do
            case "$f" in
              .github/workflows/sync-upstream.yml) ;;
              .github/workflows/*) git rm -f "$f" ;;
              *) git checkout --ours -- "$f" || true ;;
            esac
          done
      - name: Post-merge disable LFS (upstream .gitattributes re-imported)
        run: |
          git lfs uninstall || true
          git lfs install --skip-smudge || true
          rm -f .gitattributes
          git rm -f .gitattributes || true
          git config --unset-all lfs.url || true
          git config lfs.transfer.enableAliases false || true
          find .git/hooks -type f \( -name "post-checkout" -o -name "post-commit" -o -name "post-merge" -o -name "pre-push" \) -delete 2>/dev/null || true
      - name: Keep only our workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-upstream.yml" -delete
      - name: Commit and push
        run: |
          git add -f .github/workflows .gitattributes || true
          git commit -m "chore: preserve fork sync workflow" --allow-empty
          git push